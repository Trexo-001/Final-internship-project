<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: sans-serif;
      background: #18181b;
      color: #e0e0e0;
      padding: 15px;
    }
    h2 { font-size: 16px; margin-top: 0; }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #result {
      margin-top: 12px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>Phishing URL Detector</h2>
  <input type="text" id="urlInput" placeholder="https://example.com/login" />
  <button id="checkBtn">Check URL</button>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
